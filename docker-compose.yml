version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
      - web3

  web1:
    build: .
    environment:
      - PORT=5000
      - INSTANCE_ID=web1
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    cap_drop:
      - ALL

  web2:
    build: .
    environment:
      - PORT=5000
      - INSTANCE_ID=web2
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    cap_drop:
      - ALL

  web3:
    build: .
    environment:
      - PORT=5000
      - INSTANCE_ID=web3
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
    cap_drop:
      - ALL